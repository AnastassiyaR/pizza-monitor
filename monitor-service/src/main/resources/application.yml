spring:
  application:
    name: monitor-service
  main:
    web-application-type: none

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}

    consumer:
      # What to do when the group has no stored offset yet:
      #   latest   - read only new messages (like fromBeginning:false in the Node version)
      #   earliest - read the topic from the very beginning
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer wraps JsonDeserializer: a "broken" message does not put the consumer
      # into an endless loop; it is passed to the error handler and skipped.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.pizza.monitor.common.model.PizzaMetric   # which class to parse the JSON into
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.pizza.monitor.common.model

    # Producer - used to send alerts
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

pizza:
  monitor:
    alert-cooldown: ${ALERT_COOLDOWN:30s}
  thresholds:
    temp-warning: 300
    temp-critical: 310
    dough-warning: 40
    dough-critical: 20

logging:
  level:
    root: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
